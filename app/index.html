<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS SAA-C03 学習アプリ</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --fg:#1f2430; --mute:#667; --line:#dde1e8; --pri:#2557c9; --ok:#1a7f45; --ng:#c0262d; --key:#d4141c; --trap:#d96a00; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.8 -apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif; }
#app { max-width:860px; margin:0 auto; padding:16px; }
h1 { font-size:1.4rem; margin:.2em 0 .6em; } h2 { font-size:1.2rem; margin:1em 0 .4em; } h3 { font-size:1.08rem; margin:1em 0 .3em; } h4 { font-size:1.02rem; margin:.9em 0 .2em; border-left:4px solid var(--pri); padding-left:.5em; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:12px 0; }
.warn { background:#fff3cd; border:1px solid #e0b100; color:#5b4400; padding:10px 14px; border-radius:8px; margin:8px 0; }
.ok { color:var(--ok); } .ng { color:var(--ng); } .mute { color:var(--mute); font-size:.9rem; }
button { font:inherit; padding:.5em 1.1em; border:1px solid var(--pri); background:var(--pri); color:#fff; border-radius:8px; cursor:pointer; margin:4px 6px 4px 0; }
button.sub { background:#fff; color:var(--pri); } button.small { font-size:.85rem; padding:.2em .7em; }
button:disabled { opacity:.45; cursor:default; }
button.sel { outline:3px solid #f0b400; }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.bar { height:12px; background:#e5e8ee; border-radius:6px; overflow:hidden; } .bar > div { height:100%; background:var(--pri); }
.chap { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid var(--line); padding:8px 0; } .chap:first-child { border-top:0; }
.tag { font-size:.8rem; padding:1px 8px; border-radius:10px; border:1px solid var(--line); margin-left:6px; }
.tag.done { color:var(--ok); border-color:var(--ok); } .tag.prog { color:var(--pri); border-color:var(--pri); } .tag.lock { color:var(--mute); }
.pbar { height:4px; background:#e5e8ee; border-radius:2px; overflow:hidden; margin:4px 0 8px; } .pbar > div { height:100%; background:var(--pri); }
.nav { display:flex; gap:8px; margin:12px 0; } .nav button { flex:1; margin:0; padding:.7em 1em; }
details { margin:8px 0; } summary { cursor:pointer; }
.lesson { overflow-wrap:anywhere; } .lesson ul { padding-left:1.4em; }
b.key { color:var(--key); font-weight:800; }
.trap { color:var(--trap); font-weight:700; background:#fff4e5; padding:0 3px; border-radius:3px; }
code { background:#eef1f6; padding:0 .3em; border-radius:4px; font-size:.92em; }
.badge { display:inline-block; font-size:.72rem; font-weight:700; line-height:1.4; padding:0 7px; border-radius:9px; margin-right:4px; vertical-align:middle; color:#fff; }
.b-freq { background:#c0262d; } .b-cmp { background:#2557c9; } .b-trap { background:#d96a00; } .b-note { background:#667; }
.q { font-size:1.05rem; }
.multi-note { display:inline-block; background:#fff3cd; border:1px solid #e0b100; color:#5b4400; font-size:.85rem; padding:0 10px; border-radius:10px; margin-bottom:6px; }
.choice { display:block; width:100%; text-align:left; background:#fff; color:var(--fg); border:1px solid var(--line); }
.choice.sel { background:#fff8e1; border-color:#f0b400; outline:0; }
.choice.right { background:#e4f6ea; border-color:var(--ok); } .choice.wrong { background:#fde8e9; border-color:var(--ng); }
.choice.miss { background:#fff; border:2px dashed var(--ok); }
.explain { background:#f3f6fc; border-radius:8px; padding:8px 14px; margin-top:8px; }
.explain p { margin:.3em 0; }
.timer { font-weight:700; font-variant-numeric:tabular-nums; } .timer.low { color:var(--ng); }
.qgrid { display:flex; flex-wrap:wrap; gap:6px; } .qgrid button { margin:0; width:3em; padding:.3em 0; background:#fff; color:var(--fg); border-color:var(--line); }
.qgrid button.answered { background:#e4f6ea; border-color:var(--ok); } .qgrid button.flagged { border:2px solid #f0b400; background:#fff8e1; } .qgrid button.cur { outline:3px solid var(--pri); }
table.t { border-collapse:collapse; width:100%; } table.t td, table.t th { border-top:1px solid var(--line); padding:4px 8px; text-align:left; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  const L = window.Logic;
  const DATA = window.DATA || { chapters: [] };
  const chapters = DATA.chapters.slice().sort((a, b) => a.no - b.no);
  const root = document.getElementById('app');
  const PAGES_PER_BREAK = 6;

  let P, storageOk = true, storage = null, saveFailed = false, notice = '';
  let view = { name: 'home' };
  let sessionPages = 0; // この起動中に「次へ」で進めたページ数（クイズ回答は含めない）
  let timerHandle = null;

  // ---------- データ索引 ----------
  const qById = Object.create(null), lessonById = Object.create(null), chapterOfLesson = Object.create(null);
  chapters.forEach((c) => {
    c.lessons.forEach((l) => { lessonById[l.id] = l; chapterOfLesson[l.id] = c; });
    c.ox.forEach((q) => { qById[q.id] = { kind: 'ox', q }; });
    c.mc.forEach((q) => { qById[q.id] = { kind: 'mc', q }; });
  });
  // ---------- 保存 ----------
  try { storage = window.localStorage; } catch (e) { storage = null; }
  if (storage) { const r = L.loadProgress(storage); P = r.progress; storageOk = r.ok; }
  else { P = L.emptyProgress(); storageOk = false; }
  P = fixPos(P);
  function fixPos(p) { return L.fixPosition(p, (id) => (chapterOfLesson[id] ? chapterOfLesson[id].no : undefined)); }
  function save() { if (!storage || !L.saveProgress(storage, P)) saveFailed = true; }
  function setP(next) { P = next; save(); }

  const chapter = (no) => chapters.find((c) => c.no === no);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  // ユーザー入力（メモ・ID 等）は必ず esc。data 由来の HTML は信頼して描画する。
  const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ESC[m]);
  const isDone = (id) => P.lessonsDone.indexOf(id) >= 0;
  const firstUndone = (c) => c.lessons.find((l) => !isDone(l.id)) || null;
  const totalLessons = () => chapters.reduce((n, c) => n + c.lessons.length, 0);
  const doneLessons = () => chapters.reduce((n, c) => n + c.lessons.filter((l) => isDone(l.id)).length, 0);
  const pct = (x) => Math.round(x * 100);
  const LETTERS = 'ABCDEF';

  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function patchView(p) { view = Object.assign({}, view, p); }
  function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function recordAnswer(id, correct) { P = L.recordAnswer(P, id, correct, Date.now()); }
  const reportBtn = (id) => '<button class="small sub" data-act="report" data-id="' + esc(id) + '">間違いをメモ</button>';
  const fmtTime = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + '分' + ('0' + (s % 60)).slice(-2) + '秒'; };
  const fmtClock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
  const stamp = () => { const d = new Date(); return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); };
  const domainName = (no) => { const d = L.DOMAINS.find((x) => x.no === no); return d ? d.name : '不明'; };

  // ---------- 問題の描画（○×・単一/複数選択） ----------
  function choiceClass(q, i, picked, sel, showResult) {
    const letter = LETTERS[i], isAns = q.answer.indexOf(letter) >= 0, isPick = (picked || []).indexOf(letter) >= 0;
    if (showResult) return 'choice' + (isAns && isPick ? ' right' : isAns ? ' miss' : isPick ? ' wrong' : '');
    return 'choice' + (sel.indexOf(letter) >= 0 ? ' sel' : '');
  }
  function resultMark(q, i, picked) {
    const isAns = q.answer.indexOf(LETTERS[i]) >= 0, isPick = (picked || []).indexOf(LETTERS[i]) >= 0;
    if (isAns && isPick) return ' <b class="ok">○</b>';
    if (isAns) return ' <b class="ok">（選び漏れ）</b>';
    return isPick ? ' <b class="ng">×</b>' : '';
  }
  function mcChoicesHtml(q, picked, sel, showResult, act, extra) {
    return q.choices.map((c, i) => '<button class="' + choiceClass(q, i, picked, sel, showResult) + '" data-act="' + act + '" data-v="' + LETTERS[i] + '"' + (extra || '') + (showResult ? ' disabled' : '') + '>' +
      LETTERS[i] + '. ' + c + (showResult ? resultMark(q, i, picked) : '') + '</button>').join('');
  }
  const multiBadge = (q) => q.selectCount >= 2 ? '<div class="multi-note">（' + q.selectCount + 'つ選べ）</div>' : '';
  function renderQ(q, kind, picked, sel, showResult) {
    if (kind === 'ox') {
      let h = '<div class="q">' + q.text + '</div>';
      [[true, '○'], [false, '×']].forEach((p) => {
        let cls = 'choice';
        if (showResult) { if (p[0] === q.answer) cls += ' right'; else if (picked === p[0]) cls += ' wrong'; }
        h += '<button class="' + cls + '" data-act="pick" data-v="' + p[0] + '" style="width:48%;text-align:center;font-size:1.3rem"' + (showResult ? ' disabled' : '') + '>' + p[1] + '</button>';
      });
      return h;
    }
    let h = multiBadge(q) + '<div class="q">' + q.stem + '</div>' + mcChoicesHtml(q, picked, sel, showResult, 'pick');
    if (!showResult && q.selectCount >= 2) h += '<button data-act="confirm-multi"' + (sel.length === q.selectCount ? '' : ' disabled') + '>回答する（' + sel.length + '/' + q.selectCount + '）</button>';
    return h;
  }
  function explainHtml(q, kind) {
    if (kind === 'ox') return q.explain ? '<p>' + q.explain + '</p>' : '';
    return q.choiceExplain.map((e, i) => '<p class="' + (e.ok ? 'ok' : 'ng') + '">' + LETTERS[i] + '：' + (e.ok ? '○' : '×') + ' <span style="color:var(--fg)">' + e.text + '</span></p>').join('') +
      (q.tip ? '<p><b>解き方のコツ:</b> ' + q.tip + '</p>' : '');
  }
  const answerLabel = (q, kind) => kind === 'ox' ? (q.answer ? '○' : '×') : q.answer.join('、');
  const gradeAny = (it, a) => it.kind === 'ox' ? L.gradeOx(it.q, a).correct : L.gradeMc(it.q, a).correct;

  // ---------- 練習ランナー（1問ずつ即採点） ----------
  function startRun(ids, opts) {
    go({ name: 'run', items: ids.filter((id) => qById[id]).map((id) => qById[id]), i: 0, picked: null, sel: [], right: 0, opts });
  }
  function renderRun() {
    const v = view, o = v.opts;
    if (!v.items.length) return '<div class="card">問題がありません。</div><button data-act="home">戻る</button>';
    const it = v.items[v.i], q = it.q, answered = v.picked !== null && v.picked !== undefined;
    let h = '<h1>' + esc(o.title) + '</h1><div class="mute">' + (v.i + 1) + ' / ' + v.items.length + '</div><div class="card">';
    h += renderQ(q, it.kind, v.picked, v.sel, answered);
    if (answered) {
      const ok = gradeAny(it, v.picked);
      h += '<h3 class="' + (ok ? 'ok' : 'ng') + '">' + (ok ? '正解' : '不正解') + '（正解: ' + answerLabel(q, it.kind) + '）</h3>';
      h += '<div class="explain">' + explainHtml(q, it.kind) + '</div><p>' + reportBtn(q.id) + '</p>';
      h += '<button data-act="run-next">' + (v.i + 1 < v.items.length ? '次の問題へ' : '結果を見る') + '</button>';
    }
    return h + '</div><button class="sub" data-act="home">中断してホームへ</button>';
  }
  function commitRun(picked) {
    const v = view;
    if (v.picked !== null && v.picked !== undefined) return;
    const it = v.items[v.i], ok = gradeAny(it, picked);
    recordAnswer(it.q.id, ok); save();
    patchView({ picked, right: v.right + (ok ? 1 : 0) });
    render();
  }
  function toggled(sel, letter, max) {
    if (sel.indexOf(letter) >= 0) return sel.filter((x) => x !== letter);
    return sel.length >= max ? null : sel.concat([letter]).sort();
  }
  function runPick(val) {
    const v = view;
    if (v.picked !== null && v.picked !== undefined) return;
    const it = v.items[v.i];
    if (it.kind === 'ox') return commitRun(val === 'true');
    if (it.q.selectCount <= 1) return commitRun([val]);
    const next = toggled(v.sel, val, it.q.selectCount);
    if (next === null) notice = it.q.selectCount + '個を超えて選べません。選択を外してから選び直してください。';
    else patchView({ sel: next });
    rerender();
  }
  function runNext() {
    const v = view;
    if (v.i + 1 < v.items.length) { patchView({ i: v.i + 1, picked: null, sel: [] }); render(); window.scrollTo(0, 0); }
    else v.opts.onDone({ right: v.right, total: v.items.length });
  }

  // ---------- ホーム ----------
  function historyHtml() {
    const hs = P.examHistory || [];
    if (!hs.length) return '';
    const rows = hs.slice().reverse().slice(0, 10).map((h) => {
      const d = new Date(h.ts);
      return '<tr><td>' + d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '</td><td class="' + (h.pass ? 'ok' : 'ng') + '">' + h.scaled + ' / ' + L.EXAM.maxScaled + '</td><td>' + h.correct + ' / ' + h.scored + '</td><td>' + (h.pass ? '合格' : '不合格') + '</td></tr>';
    }).join('');
    const bars = hs.map((h) => '<div title="' + h.scaled + '" style="flex:1;min-width:6px;height:' + Math.round(L.scaledToPercent(h.scaled)) + 'px;background:' + (h.pass ? 'var(--ok)' : 'var(--ng)') + '"></div>').join('');
    return '<div class="card"><h2>総仕上げのスコア推移</h2><div style="display:flex;align-items:flex-end;gap:3px;height:100px;border-bottom:1px solid var(--line)">' + bars + '</div>' +
      '<table class="t"><tr><th>日付</th><th>スコア</th><th>採点対象の正解</th><th>判定</th></tr>' + rows + '</table></div>';
  }
  function chapterRow(c) {
    const unlocked = L.isChapterUnlocked(P, c.no), done = c.lessons.filter((l) => isDone(l.id)).length, t = P.chapterTest[c.no];
    const tag = !unlocked ? '<span class="tag lock">ロック</span>' : (t && t.passed ? '<span class="tag done">完了</span>' : (done > 0 || (P.position && P.position.ch === c.no) ? '<span class="tag prog">進行中</span>' : ''));
    let h = '<div class="chap"><div>第' + c.no + '章 ' + esc(c.title) + tag + '<div class="mute">' + esc(c.domainNote || '') + '</div><div class="mute">レッスン ' + done + '/' + c.lessons.length +
      (t ? '　章末テスト ' + pct(t.score) + '%' + (t.passed ? '（合格）' : '（不合格）') : '') + '</div></div><div>';
    if (unlocked) {
      h += '<button data-act="chapter-start" data-ch="' + c.no + '">' + (done ? '学習する' : '始める') + '</button>';
      h += '<button class="sub" data-act="chapter-test" data-ch="' + c.no + '"' + (c.mc.length ? '' : ' disabled') + '>章末テスト</button>';
    } else h += '<span class="mute">前の章の章末テストに合格すると開きます</span>';
    return h + '</div></div>';
  }
  function homeView() {
    const tot = totalLessons(), dn = doneLessons(), cont = continueTarget();
    let h = '<h1>AWS SAA-C03 学習アプリ</h1><div class="card"><div class="row"><b>全体の進捗</b><span class="mute">レッスン ' + dn + ' / ' + tot + '</span></div>';
    h += '<div class="bar"><div style="width:' + (tot ? Math.round(dn * 100 / tot) : 0) + '%"></div></div>';
    h += cont ? '<p><button data-act="continue">続きから（' + esc(cont.label) + '）</button></p>' : '<p class="mute">続きから進めるレッスンはありません（全章の学習が完了、またはロック中）。</p>';
    h += '</div><div class="card"><h2>章一覧</h2>' + chapters.map(chapterRow).join('') + '</div>' + historyHtml();
    const eu = L.examUnlocked(P, DATA);
    h += '<div class="card"><h2>その他</h2><div class="row"><button data-act="exam"' + (eu ? '' : ' disabled') + '>総仕上げ（' + L.EXAM.total + '問・' + L.EXAM.minutes + '分）</button>' +
      (eu ? '' : '<span class="mute">全章の章末テスト合格で開きます</span>') + '<button class="sub" data-act="overview">試験概要</button></div>';
    h += '<div class="row"><button class="sub" data-act="review">復習（間違えた問題 ' + P.wrongLog.filter((id) => qById[id]).length + ' 問）</button>';
    return h + '<button class="sub" data-act="reports">間違いメモ（' + P.reports.length + '件）</button><button class="sub" data-act="settings">設定</button></div></div>';
  }
  function continueTarget() {
    const pos = P.position;
    if (pos && lessonById[pos.lessonId] && L.isChapterUnlocked(P, pos.ch) && !isDone(pos.lessonId)) {
      const c = chapterOfLesson[pos.lessonId], pi = pageIdx(lessonById[pos.lessonId], pos.page || 0);
      return { id: pos.lessonId, page: pi, label: '第' + c.no + '章 ' + lessonById[pos.lessonId].title + ' ページ' + (pi + 1) };
    }
    for (const ch of chapters) {
      if (!L.isChapterUnlocked(P, ch.no)) continue;
      const u = firstUndone(ch);
      if (u) return { id: u.id, page: 0, label: '第' + ch.no + '章 ' + u.title };
    }
    return null;
  }

  function overviewView() {
    const E = L.EXAM;
    const rows = L.DOMAINS.map((d) => '<tr><td>ドメイン' + d.no + '</td><td>' + esc(d.name) + '</td><td>' + d.weight + '%</td></tr>').join('');
    return '<h1>試験概要</h1><div class="card lesson"><ul><li>出題数 ' + E.total + '問（採点対象 ' + E.scored + '問、採点対象外 ' + (E.total - E.scored) + '問。どれが対象外かは分かりません）</li>' +
      '<li>試験時間 ' + E.minutes + '分</li><li>スコア ' + E.minScaled + '〜' + E.maxScaled + '、' + E.passScaled + ' 以上で合格</li>' +
      '<li>形式は多肢選択のみ。単一選択（4択・1つ）と複数選択（5択・2つ）があり、複数選択は部分点なし</li></ul>' +
      '<table class="t"><tr><th>ドメイン</th><th>名称</th><th>出題比率</th></tr>' + rows + '</table></div>' +
      '<p class="mute">このアプリのスコア換算は近似式です（実際の換算は非公開）。</p><button data-act="home">ホームへ</button>';
  }

  // ---------- レッスン（1画面 = 1ページ） ----------
  function pageIdx(l, page) { const n = parseInt(page, 10); return n >= 0 && n < l.pages.length ? n : 0; }
  function openLesson(id, page, keepDone) {
    const c = chapterOfLesson[id], pg = pageIdx(lessonById[id], page);
    setP(L.setPosition(P, { ch: c.no, lessonId: id, page: pg }));
    go({ name: 'lesson', id, page: pg, step: 'read', qi: 0, picked: null, right: 0, quizDone: keepDone || {} });
  }
  function pageQs(pg) { return pg.oxIds.map((id) => qById[id]).filter(Boolean).map((x) => x.q); }
  function lessonView() {
    const v = view, l = lessonById[v.id], c = chapterOfLesson[v.id], pg = l.pages[v.page], n = l.pages.length;
    const qs = pageQs(pg), idx = c.lessons.indexOf(l);
    let h = '<div class="mute">第' + c.no + '章 ' + esc(l.title) + ' ・ ページ ' + (v.page + 1) + '/' + n + '</div>';
    h += '<div class="pbar"><div style="width:' + Math.round((v.page + 1) * 100 / n) + '%"></div></div><h1>' + esc(pg.title) + '</h1>';
    if (v.step === 'quiz') return h + lessonQuizHtml(pg, qs);
    h += '<div class="card lesson">' + pg.html + '</div><p>' + reportBtn(pg.id) + '</p>';
    const qd = v.quizDone[pg.id];
    if (qs.length && qd) h += '<p class="mute">確認クイズ: ' + qd.right + '/' + qd.total + '問正解 <button class="small sub" data-act="page-quiz">もう一度挑戦</button></p>';
    h += '<div class="nav"><button class="sub" data-act="page-prev"' + (v.page === 0 ? ' disabled' : '') + '>前へ</button>';
    if (qs.length && !qd) h += '<button data-act="page-quiz">次へ（確認クイズ ' + qs.length + '問）</button>';
    else h += '<button data-act="page-next">' + (v.page + 1 < n ? '次へ' : (idx + 1 < c.lessons.length ? '次へ（このレッスンを終える）' : '次へ（章の終わりへ）')) + '</button>';
    return h + '</div><button class="sub small" data-act="home">ホームへ（位置は保存済み）</button>';
  }
  function lessonQuizHtml(pg, qs) {
    const v = view, q = qs[v.qi], answered = v.picked !== null;
    let h = '<div class="mute">確認クイズ ' + (v.qi + 1) + ' / ' + qs.length + '</div><div class="card">' + renderQ(q, 'ox', v.picked, [], answered);
    if (answered) {
      const ok = L.gradeOx(q, v.picked).correct;
      h += '<h3 class="' + (ok ? 'ok' : 'ng') + '">' + (ok ? '正解' : '不正解') + '（正解: ' + answerLabel(q, 'ox') + '）</h3><div class="explain">' + explainHtml(q, 'ox') + '</div><p>' + reportBtn(q.id) + '</p>';
    }
    h += '</div><details><summary class="mute">本文を読み返す</summary><div class="card lesson">' + pg.html + '</div></details>';
    h += '<div class="nav"><button class="sub" data-act="quiz-back">前へ（本文に戻る）</button>';
    if (answered) h += '<button data-act="quiz-next">' + (v.qi + 1 < qs.length ? '次の問題へ' : '次へ') + '</button>';
    return h + '</div>';
  }
  function lessonPick(val) {
    const v = view, q = pageQs(lessonById[v.id].pages[v.page])[v.qi];
    if (v.picked !== null) return;
    const picked = val === 'true', ok = L.gradeOx(q, picked).correct;
    recordAnswer(q.id, ok); save();
    patchView({ picked, right: v.right + (ok ? 1 : 0) });
    render();
  }
  function quizNext() {
    const v = view, pg = lessonById[v.id].pages[v.page], qs = pageQs(pg);
    if (v.qi + 1 < qs.length) { patchView({ qi: v.qi + 1, picked: null }); render(); window.scrollTo(0, 0); return; }
    const done = Object.assign({}, v.quizDone); done[pg.id] = { right: v.right, total: qs.length };
    patchView({ quizDone: done });
    advance();
  }
  function advance() {
    const v = view, l = lessonById[v.id], c = chapterOfLesson[v.id], i = v.page;
    let tgt;
    sessionPages++;
    if (i + 1 < l.pages.length) tgt = { id: l.id, page: i + 1 };
    else {
      P = L.markLessonDone(P, l.id);
      const nx = firstUndone(c);
      tgt = nx ? { id: nx.id, page: 0 } : { end: c.no };
    }
    if (tgt.id) P = L.setPosition(P, { ch: c.no, lessonId: tgt.id, page: tgt.page });
    save();
    if (sessionPages % PAGES_PER_BREAK === 0) go({ name: 'break', tgt });
    else runTarget(tgt, v.quizDone);
  }
  function runTarget(t, qd) {
    if (t.id) openLesson(t.id, t.page, t.id === view.id ? qd : {});
    else go({ name: 'chapterend', ch: t.end });
  }
  function breakView() {
    const t = view.tgt;
    return '<h1>ここまで読みました</h1><div class="card"><p>進捗は保存されています。区切りがよければ今日はここまでにできます。</p></div>' +
      '<button data-act="break-go">' + (t.id ? '続ける' : '章の終わりへ') + '</button><button class="sub" data-act="home">今日はここまで</button>';
  }
  function chapterEndView() {
    const c = chapter(view.ch), t = P.chapterTest[c.no];
    return '<h1>第' + c.no + '章 のレッスンはすべて完了</h1><div class="card"><p>章末テストで理解度を確認しましょう（正答率 ' + pct(P.settings.passRate) + '% 以上で合格' + L.chapterEndHint(P) + '）。</p>' +
      (t ? '<p class="mute">前回: ' + pct(t.score) + '%' + (t.passed ? '（合格）' : '（不合格）') + '</p>' : '') + '</div>' +
      '<button data-act="chapter-test" data-ch="' + c.no + '"' + (c.mc.length ? '' : ' disabled') + '>章末テストへ</button><button class="sub" data-act="home">ホームへ</button>';
  }

  // ---------- 章末テスト・復習 ----------
  function startChapterTest(no) {
    startRun(chapter(no).mc.map((q) => q.id), {
      title: '第' + no + '章 章末テスト',
      onDone(s) {
        const rate = s.total ? s.right / s.total : 0;
        const passed = rate >= P.settings.passRate;
        setP(L.recordChapterTest(P, no, rate));
        go({ name: 'ctresult', ch: no, s, rate, passed });
      },
    });
  }
  function ctResultView() {
    const v = view, nextC = chapter(v.ch + 1);
    return '<h1>第' + v.ch + '章 章末テスト 結果</h1><div class="card"><p>' + v.s.total + '問中 ' + v.s.right + '問正解（' + pct(v.rate) + '%）</p>' +
      '<h2 class="' + (v.passed ? 'ok' : 'ng') + '">' + (v.passed ? '合格' : '不合格（基準 ' + pct(P.settings.passRate) + '%）') + '</h2>' +
      (v.passed ? '<p>' + L.chapterPassMessage(P, nextC ? nextC.no : null) + '</p>' : '<p>レッスンを見直してもう一度挑戦できます。</p>') + '</div>' +
      '<button data-act="home">ホームへ</button><button class="sub" data-act="chapter-test" data-ch="' + v.ch + '">もう一度</button>';
  }
  function startReview() {
    startRun(P.wrongLog.filter((id) => qById[id]), {
      title: '復習（間違えた問題）',
      onDone(s) { go({ name: 'simple', title: '復習 結果', body: '<p>' + s.total + '問中 ' + s.right + '問正解。正解した問題は復習リストから外れました。</p>' }); },
    });
  }

  // ---------- 総仕上げ ----------
  function startExam() {
    const exam = L.buildExam({ chapters });
    if (!exam.mc.length) { go({ name: 'simple', title: '総仕上げ', body: '<p>問題がありません。</p>' }); return; }
    const t0 = Date.now();
    go({ name: 'exam', exam, answers: {}, flags: {}, i: 0, step: 'q', t0, result: null });
    startTimer();
  }
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }
  function startTimer() {
    stopTimer();
    timerHandle = setInterval(tick, 1000);
  }
  function tick() {
    const v = view;
    if (v.name !== 'exam' || v.result) { stopTimer(); return; }
    const el = document.getElementById('timer');
    const limit = P.settings.examTimeLimit !== false, ms = L.examLimitMs(), used = Date.now() - v.t0;
    if (L.isExamExpired(v.t0, Date.now(), limit)) { submitExam(); return; }
    if (el) {
      el.textContent = limit ? fmtClock(ms - used) : fmtTime(used);
      el.className = 'timer' + (limit && ms - used <= L.LOW_TIME_MS ? ' low' : '');
    }
  }
  function timerHtml() {
    const limit = P.settings.examTimeLimit !== false;
    return (limit ? '残り時間 ' : '経過時間 ') + '<b class="timer" id="timer"></b>';
  }
  const examAns = (v, id) => v.answers[id] || [];
  function examQuestionHtml() {
    const v = view, q = v.exam.mc[v.i], sel = examAns(v, q.id);
    let h = '<div class="card"><div class="mute">問' + (v.i + 1) + ' / ' + v.exam.mc.length + (v.flags[q.id] ? '　<b style="color:#b07d00">見直し</b>' : '') + '</div>' +
      multiBadge(q) + '<div class="q">' + q.stem + '</div>' + mcChoicesHtml(q, null, sel, false, 'exam-pick') + '</div>';
    h += '<div class="nav"><button class="sub" data-act="exam-prev"' + (v.i === 0 ? ' disabled' : '') + '>前へ</button>' +
      '<button class="sub" data-act="exam-flag">' + (v.flags[q.id] ? '見直しを外す' : '見直しにする') + '</button>' +
      '<button data-act="exam-next"' + (v.i + 1 >= v.exam.mc.length ? ' disabled' : '') + '>次へ</button></div>';
    return h + '<div class="row"><button class="sub" data-act="exam-list">問題番号一覧</button><button class="sub" data-act="exam-confirm">終了して確認へ</button></div>';
  }
  function examListHtml() {
    const v = view;
    const cells = v.exam.mc.map((q, i) => '<button class="' + (examAns(v, q.id).length ? 'answered' : '') + (v.flags[q.id] ? ' flagged' : '') + (i === v.i ? ' cur' : '') + '" data-act="exam-goto" data-i="' + i + '">' + (i + 1) + '</button>').join('');
    return '<div class="card"><h2>問題番号一覧</h2><div class="qgrid">' + cells + '</div><p class="mute">緑＝回答済み、黄枠＝見直し、白＝未回答</p></div>' +
      '<button data-act="exam-back">問題に戻る</button><button class="sub" data-act="exam-confirm">終了して確認へ</button>';
  }
  function examConfirmHtml() {
    const v = view, mc = v.exam.mc;
    const unanswered = mc.filter((q) => !examAns(v, q.id).length).length, flagged = mc.filter((q) => v.flags[q.id]).length;
    return '<div class="card"><h2>最終確認</h2><p>未回答 <b class="' + (unanswered ? 'ng' : 'ok') + '">' + unanswered + '</b> 問、見直しフラグ ' + flagged + ' 問。採点後は取り消せません。</p></div>' +
      '<button data-act="exam-submit">採点する</button><button class="sub" data-act="exam-list">問題番号一覧へ</button><button class="sub" data-act="exam-back">問題に戻る</button>';
  }
  function examView() {
    const v = view;
    if (v.result) return examResultView();
    if (!v.exam.mc.length) return '<div class="card">問題がありません。</div><button data-act="home">戻る</button>';
    const answered = v.exam.mc.filter((q) => examAns(v, q.id).length).length;
    let h = '<h1>総仕上げ（' + v.exam.mc.length + '問）</h1><div class="card">' + timerHtml() + '　<span class="mute">回答済み ' + answered + ' / ' + v.exam.mc.length + '</span></div>';
    h += v.step === 'list' ? examListHtml() : v.step === 'confirm' ? examConfirmHtml() : examQuestionHtml();
    return h + '<p><button class="small sub" data-act="home">中断してホームへ（採点されません）</button></p>';
  }
  function examPick(letter) {
    if (L.isExamExpired(view.t0, Date.now(), P.settings.examTimeLimit !== false)) { submitExam(); return; }
    const v = view, q = v.exam.mc[v.i], cur = examAns(v, q.id);
    const next = q.selectCount <= 1 ? [letter] : toggled(cur, letter, q.selectCount);
    if (next === null) { notice = q.selectCount + '個を超えて選べません。選択を外してから選び直してください。'; return rerender(); }
    patchView({ answers: Object.assign({}, v.answers, { [q.id]: next }) });
    rerender();
  }
  function submitExam() {
    const v = view;
    if (v.name !== 'exam' || v.result) return;
    stopTimer();
    const r = L.scoreExam(v.exam, v.answers);
    v.exam.mc.forEach((q) => { recordAnswer(q.id, Object.prototype.hasOwnProperty.call(v.answers, q.id) && L.gradeMc(q, v.answers[q.id]).correct); });
    P = L.addExamHistory(P, { ts: Date.now(), scaled: r.scaled, correct: r.correctScored, scored: r.scored, pass: r.pass, byDomain: r.byDomain });
    save();
    patchView({ result: r, elapsed: Date.now() - v.t0 });
    render(); window.scrollTo(0, 0);
  }
  function resultRows(map, label) {
    return Object.keys(map).sort((a, b) => a - b).map((k) => {
      const b = map[k];
      return '<div class="chap"><div>' + label(+k) + '</div><div>' + b.correct + ' / ' + b.total + '（' + pct(b.correct / b.total) + '%）</div></div>';
    }).join('');
  }
  function wrongItemHtml(q, v, unscored) {
    const a = v.answers[q.id];
    return '<div class="explain"><div class="q">' + (unscored[q.id] ? '<span class="tag">採点対象外</span> ' : '') + multiBadge(q) + q.stem + '</div>' +
      mcChoicesHtml(q, a || [], [], true, 'noop') +
      '<p class="ng">あなたの選択: ' + (a && a.length ? a.join('、') : '未回答') + '　正解: ' + q.answer.join('、') + '</p>' + explainHtml(q, 'mc') + '<p>' + reportBtn(q.id) + '</p></div>';
  }
  function unscoredListHtml(v) {
    const rows = L.unscoredSummary(v.exam, v.answers);
    if (!rows.length) return '';
    return '<div class="card"><h2>採点対象外の問題（' + rows.length + '問）</h2><table class="t"><tr><th>問題番号</th><th>正誤</th></tr>' +
      rows.map((r) => '<tr><td>問' + r.no + '</td><td class="' + (r.correct ? 'ok' : 'ng') + '">' + (r.correct ? '正解' : '不正解') + '</td></tr>').join('') + '</table></div>';
  }
  function examResultView() {
    const v = view, r = v.result, unscored = {};
    r.unscoredIds.forEach((id) => { unscored[id] = true; });
    let h = '<h1>総仕上げ 結果</h1><div class="card"><h2 class="' + (r.pass ? 'ok' : 'ng') + '">' + r.scaled + ' / ' + r.max + '　' + (r.pass ? '合格ライン到達' : '合格ライン（' + L.EXAM.passScaled + '）未満') + '</h2>' +
      '<p>採点対象 ' + r.scored + '問中 ' + r.correctScored + '問正解（全' + r.total + '問中 ' + r.correctAll + '問正解）　所要時間 ' + fmtTime(v.elapsed) + '</p>' +
      '<p class="mute">スコアは ' + L.EXAM.minScaled + ' + ' + (L.EXAM.maxScaled - L.EXAM.minScaled) + ' × 正解数/採点対象数 の近似式です（実際の換算は非公開）。</p></div>';
    h += '<div class="card"><h2>ドメイン別成績（全問）</h2>' + resultRows(r.byDomain, (k) => 'ドメイン' + k + ' ' + esc(domainName(k))) + '</div>';
    h += '<div class="card"><h2>章別成績（全問）</h2>' + resultRows(r.byChapter, (k) => { const c = chapter(k); return '第' + k + '章 ' + esc(c ? c.title : ''); }) + '</div>';
    h += unscoredListHtml(v);
    h += '<div class="card"><h2>間違えた問題・未回答</h2>';
    const wrongs = v.exam.mc.filter((q) => !(v.answers[q.id] && L.gradeMc(q, v.answers[q.id]).correct));
    h += wrongs.length ? wrongs.map((q) => wrongItemHtml(q, v, unscored)).join('') : '<p>全問正解です。</p>';
    return h + '</div><button data-act="home">ホームへ</button><button class="sub" data-act="exam">もう一度</button>';
  }

  // ---------- 間違いメモ / 設定 ----------
  function reportsView() {
    let h = '<h1>間違いメモ</h1><div class="card">';
    if (!P.reports.length) h += '<p class="mute">まだありません。レッスンや問題の「間違いをメモ」から追加できます。</p>';
    P.reports.forEach((r, i) => {
      h += '<div class="chap"><div><span class="mute">' + esc(r.id) + '</span><br>' + esc(r.memo) + '</div><button class="small sub" data-act="report-del" data-i="' + i + '">削除</button></div>';
    });
    return h + '</div><button data-act="export-reports"' + (P.reports.length ? '' : ' disabled') + '>メモを書き出す</button><button class="sub" data-act="home">ホームへ</button>';
  }
  function settingsView() {
    const s = P.settings;
    return '<h1>設定</h1><div class="card"><h2>章末テストの合格基準</h2><label>正答率 <input type="number" id="passRate" min="' + pct(L.PASS_RATE.min) + '" max="' + pct(L.PASS_RATE.max) + '" step="5" value="' + pct(s.passRate) + '" style="width:5em;font:inherit"> %</label> <button class="small" data-act="set-pass">変更</button></div>' +
      '<div class="card"><h2>全章を開放</h2><p class="mute">章のロックと総仕上げのロックを解除します。</p><label><input type="checkbox" id="unlockAll"' + (s.unlockAll ? ' checked' : '') + '> 全章を開放する</label> <button class="small" data-act="set-unlock">反映</button></div>' +
      '<div class="card"><h2>総仕上げの制限時間</h2><label><input type="checkbox" id="examTimeLimit"' + (s.examTimeLimit !== false ? ' checked' : '') + '> 総仕上げの制限時間を使う（' + L.EXAM.minutes + '分で自動採点）</label> <button class="small" data-act="set-timelimit">反映</button></div>' +
      '<div class="card"><h2>進捗のバックアップ</h2><button data-act="export">進捗JSONを書き出す</button><p><input type="file" id="importFile" accept=".json,application/json"></p><button class="sub" data-act="import">読み込む</button></div>' +
      '<div class="card"><h2>進捗の消去</h2><button class="sub" data-act="reset">すべて消去</button></div><button class="sub" data-act="home">ホームへ</button>';
  }
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  // ---------- 描画 ----------
  const VIEWS = {
    home: homeView, lesson: lessonView, run: renderRun, break: breakView, chapterend: chapterEndView, ctresult: ctResultView,
    exam: examView, reports: reportsView, settings: settingsView, overview: overviewView,
    simple: () => '<h1>' + esc(view.title) + '</h1><div class="card">' + view.body + '</div><button data-act="home">ホームへ</button>',
  };
  function render() {
    let h = '';
    if (!storageOk) h += '<div class="warn">保存できません：ブラウザの保存領域を使えない、または保存データが壊れていたため、進捗なしで起動しました。進捗は記録されない可能性があります。「設定」から進捗JSONを書き出してバックアップしてください。</div>';
    if (saveFailed) h += '<div class="warn">進捗を保存できませんでした。設定の「進捗JSONを書き出す」でバックアップしてください。</div>';
    if (notice) { h += '<div class="warn">' + esc(notice) + '</div>'; notice = ''; }
    if (!chapters.length) h += '<div class="warn">教材データ（data-ch*.js）が読み込まれていません。</div>';
    h += (VIEWS[view.name] || homeView)();
    root.innerHTML = h;
    if (view.name === 'exam' && !view.result) tick();
  }

  function addMemo(id) {
    const memo = window.prompt('どこが間違いだと思いますか?（メモ）\n対象: ' + id, '');
    if (memo === null || !memo.trim()) return;
    setP(L.addReport(P, id, memo.trim(), Date.now()));
    notice = 'メモを保存しました（' + id + '）。';
    rerender();
  }
  function applyPassRate() {
    const pr = parseInt(document.getElementById('passRate').value, 10);
    if (pr >= pct(L.PASS_RATE.min) && pr <= pct(L.PASS_RATE.max)) { setP(L.updateSettings(P, { passRate: pr / 100 })); notice = '合格基準を ' + pr + '% にしました。'; }
    else notice = pct(L.PASS_RATE.min) + '〜' + pct(L.PASS_RATE.max) + ' の数値を入れてください。';
    render();
  }
  function applyCheckbox(elId, key, msgOn, msgOff) {
    const on = document.getElementById(elId).checked, patch = {};
    patch[key] = on;
    setP(L.updateSettings(P, patch));
    notice = on ? msgOn : msgOff;
    render();
  }
  function importFile() {
    const f = document.getElementById('importFile').files[0];
    if (!f) { notice = 'ファイルを選んでください。'; render(); return; }
    const fr = new FileReader();
    fr.onload = () => {
      const res = L.importProgress(String(fr.result), P);
      if (res.error) notice = '読み込めませんでした: ' + res.error + '（現在の進捗は変更していません）';
      else { setP(fixPos(res.progress)); notice = '進捗を読み込みました。'; }
      render();
    };
    fr.readAsText(f);
  }
  function chapterStart(no) {
    const ch = chapter(no), u = firstUndone(ch);
    if (u) openLesson(u.id, P.position && P.position.lessonId === u.id ? P.position.page || 0 : 0);
    else if (ch.lessons.length) openLesson(ch.lessons[0].id);
  }

  const ACTIONS = {
    home() { stopTimer(); go({ name: 'home' }); },
    continue() { const c = continueTarget(); if (c) openLesson(c.id, c.page); },
    'chapter-start': (d) => chapterStart(parseInt(d.ch, 10)),
    'chapter-test': (d) => startChapterTest(parseInt(d.ch, 10)),
    'page-prev'() { if (view.page > 0) openLesson(view.id, view.page - 1, view.quizDone); },
    'page-next': advance,
    'page-quiz'() { patchView({ step: 'quiz', qi: 0, picked: null, right: 0 }); render(); window.scrollTo(0, 0); },
    'quiz-back'() { patchView({ step: 'read' }); render(); window.scrollTo(0, 0); },
    'quiz-next': quizNext,
    'break-go'() { runTarget(view.tgt, {}); },
    pick(d) { if (view.name === 'lesson') lessonPick(d.v); else if (view.name === 'run') runPick(d.v); },
    'confirm-multi'() { if (view.name === 'run' && view.sel.length === view.items[view.i].q.selectCount) commitRun(view.sel); },
    'run-next'() { if (view.name === 'run') runNext(); },
    review: startReview,
    exam: startExam,
    overview() { go({ name: 'overview' }); },
    'exam-pick': (d) => examPick(d.v),
    'exam-prev'() { patchView({ i: Math.max(0, view.i - 1) }); render(); window.scrollTo(0, 0); },
    'exam-next'() { patchView({ i: Math.min(view.exam.mc.length - 1, view.i + 1) }); render(); window.scrollTo(0, 0); },
    'exam-flag'() { const id = view.exam.mc[view.i].id; patchView({ flags: Object.assign({}, view.flags, { [id]: !view.flags[id] }) }); rerender(); },
    'exam-list'() { patchView({ step: 'list' }); render(); window.scrollTo(0, 0); },
    'exam-goto': (d) => { patchView({ i: parseInt(d.i, 10), step: 'q' }); render(); window.scrollTo(0, 0); },
    'exam-back'() { patchView({ step: 'q' }); render(); window.scrollTo(0, 0); },
    'exam-confirm'() { patchView({ step: 'confirm' }); render(); window.scrollTo(0, 0); },
    'exam-submit': submitExam,
    report: (d) => addMemo(d.id),
    reports() { go({ name: 'reports' }); },
    'report-del': (d) => { setP(L.removeReport(P, parseInt(d.i, 10))); render(); },
    'export-reports'() { download('saa-c03-reports-' + stamp() + '.json', JSON.stringify(P.reports, null, 2)); },
    settings() { go({ name: 'settings' }); },
    'set-pass': applyPassRate,
    'set-unlock'() { applyCheckbox('unlockAll', 'unlockAll', '全章を開放しました。', '開放を解除しました。'); },
    'set-timelimit'() { applyCheckbox('examTimeLimit', 'examTimeLimit', '総仕上げの制限時間を使います。', '総仕上げは経過時間の表示のみにします。'); },
    export() { download('saa-c03-progress-' + stamp() + '.json', JSON.stringify(P, null, 2)); },
    import: importFile,
    reset() {
      if (!window.confirm('進捗をすべて消去します。よろしいですか?')) return;
      setP(L.emptyProgress()); sessionPages = 0; notice = '消去しました。'; go({ name: 'home' });
    },
    noop() {},
  };

  root.addEventListener('click', (e) => {
    let t = e.target;
    while (t && t !== root && !(t.dataset && t.dataset.act)) t = t.parentNode;
    if (!t || t === root) return;
    const fn = ACTIONS[t.dataset.act];
    if (fn) fn(t.dataset);
  });

  // 起動時：保存された位置のレッスンを開く（ホームから「続きから」でも可）
  const pos = P.position;
  if (pos && lessonById[pos.lessonId] && !isDone(pos.lessonId) && L.isChapterUnlocked(P, pos.ch)) openLesson(pos.lessonId, pos.page || 0);
  render();
})();
</script>
</body>
</html>
